<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolam Kreate - Daily Calming Ritual</title>
    <style>
        /* --- MINIMALIST WELLNESS STYLING --- */
        :root {
            --bg-color: #161210;         /* Deep, comforting warm charcoal */
            --text-main: #f4eae0;        /* Soft sand white (low eye strain) */
            --text-muted: #a6998e;       /* Muted earth gray */
            --accent-color: #e08262;     /* Warm terracotta clay */
            --accent-glow: rgba(224, 130, 98, 0.4);
            --dot-color: rgba(244, 234, 224, 0.25);
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.06);
            --transition-speed: 0.5s;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background var(--transition-speed) ease;
        }

        /* Ambient Breathing Backdrop Background Animation */
        .ambient-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(224, 130, 98, 0.06) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: breatheGlow 12s ease-in-out infinite;
            pointer-events: none;
            transition: opacity var(--transition-speed) ease;
        }

        @keyframes breatheGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* App Layout Container */
        .ritual-container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        /* Minimal Header - Simplified to a Single Clean Title */
        .ritual-header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .ritual-header h1 {
            font-size: 2rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
            animation: textPulse 6s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.8; color: var(--text-main); }
            50% { opacity: 1; color: var(--accent-color); }
        }

        /* MAXIMIZED CANVAS CONTAINER */
        .canvas-wrapper {
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 800px;
            height: 72vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all var(--transition-speed) ease;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none; 
            image-rendering: -webkit-optimize-contrast; /* Clear modern anti-aliasing */
        }

        /* Minimal Footers & Custom Buttons */
        .ritual-footer {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transform-origin: bottom center;
            transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Dynamic Class applied during canvas interactions */
        .ritual-footer.minimize-controls {
            transform: scale(0.7);
            opacity: 0.35;
        }

        .left-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .symmetry-badge {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            font-family: inherit;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
        }

        .btn-secondary:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #161210;
            font-weight: 500;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-zen {
            background: rgba(224, 130, 98, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(224, 130, 98, 0.2);
        }

        .btn-zen:hover {
            background: rgba(224, 130, 98, 0.2);
        }

        /* --- ZEN MODE STATE MODIFIERS --- */
        body.zen-active {
            background-color: #0f0d0c; 
        }

        body.zen-active .ritual-header {
            opacity: 0;
            transform: translateY(-30px);
            pointer-events: none;
        }

        body.zen-active .ritual-footer {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
        }

        body.zen-active .canvas-wrapper {
            max-width: 100vw;
            height: 95vh;
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            backdrop-filter: none;
        }

        /* Zen Mode Instruction Overlay hint */
        .zen-hint {
            position: absolute;
            bottom: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        body.zen-active .zen-hint {
            animation: pulseHint 5s forwards;
        }

        @keyframes pulseHint {
            0% { opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambientGlow"></div>
    <div class="zen-hint">Double tap anywhere to exit Zen Mode</div>

    <div class="ritual-container">
        <header class="ritual-header" id="header">
            <h1>Kolam Kreate</h1>
        </header>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="kolamCanvas"></canvas>
        </div>

        <footer class="ritual-footer" id="footer">
            <div class="left-controls">
                <div class="symmetry-badge">🍃 Free Flow Mode</div>
                <button id="gridBtn" class="btn-secondary">🎛️ Grid: 7×5</button>
                <button id="sizeBtn" class="btn-secondary">⚪ Dot Size: Regular</button>
                <button id="zenBtn" class="btn-zen">👁️ Zen Mode</button>
            </div>
            <div class="action-buttons">
                <button id="clearBtn" class="btn-secondary">Release</button>
                <button id="completeBtn" class="btn-primary">Save Ritual</button>
            </div>
        </footer>
    </div>

    <script>
        // --- CALMING ENGINE (JAVASCRIPT) ---
        const canvas = document.getElementById('kolamCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        const footer = document.getElementById('footer');
        const clearBtn = document.getElementById('clearBtn');
        const completeBtn = document.getElementById('completeBtn');
        const zenBtn = document.getElementById('zenBtn');
        const sizeBtn = document.getElementById('sizeBtn');
        const gridBtn = document.getElementById('gridBtn');

        // Dynamic Resize Logic to fill standard dynamic Viewport grids
        let canvasW, canvasH;
        let dots = [];
        
        // Multi-Grid Array Configuration
        const gridLayouts = [
            { x: 7, y: 5, label: "7×5" },
            { x: 9, y: 7, label: "9×7" },
            { x: 11, y: 9, label: "11×9" },
            { x: 5, y: 5, label: "5×5" }
        ];
        let currentGridIndex = 0;

        let spacing = 55; 
        const proximityRadius = 20; // Radius to wake up dots when drawing close to them
        
        let drawingStroke = []; 
        let completedStrokes = []; 
        let isDrawing = false;
        let isDissolving = false;
        let zenModeActive = false;

        // Dot Configurable Settings Matrix
        const dotSizes = {
            'Regular': 4,
            'Medium': 7,
            'Large': 11
        };
        const dotSizeSequence = ['Regular', 'Medium', 'Large'];
        let currentSizeIndex = 0;

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            canvasW = rect.width - 32; 
            canvasH = rect.height - 32;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = `${canvasW}px`;
            canvas.style.height = `${canvasH}px`;
            ctx.scale(dpr, dpr);
            
            const currentLayout = gridLayouts[currentGridIndex];
            if (canvasW < (currentLayout.x * 60) || canvasH < (currentLayout.y * 60)) {
                spacing = Math.min((canvasW - 40) / currentLayout.x, (canvasH - 40) / currentLayout.y);
            } else {
                spacing = 58;
            }

            initGrid();
            drawScene();
        }

        // Initialize Center-aligned Dot Matrix
        function initGrid() {
            dots = [];
            const activeLayout = gridLayouts[currentGridIndex];
            
            const startX = (canvasW - (activeLayout.x - 1) * spacing) / 2;
            const startY = (canvasH - (activeLayout.y - 1) * spacing) / 2;

            for (let i = 0; i < activeLayout.x; i++) {
                for (let j = 0; j < activeLayout.y; j++) {
                    dots.push({
                        x: startX + i * spacing,
                        y: startY + j * spacing,
                        active: false
                    });
                }
            }
        }

        // Render Routine
        function drawScene(opacity = 1) {
            ctx.clearRect(0, 0, canvasW, canvasH);

            const activeRadius = dotSizes[dotSizeSequence[currentSizeIndex]];

            // 1. Draw Geometric Background Dots
            dots.forEach(dot => {
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, activeRadius, 0, Math.PI * 2);
                ctx.fillStyle = dot.active ? `rgba(224, 130, 98, ${opacity})` : `rgba(244, 234, 224, ${0.25 * opacity})`;
                
                if (dot.active) {
                    ctx.shadowColor = '#e08262';
                    ctx.shadowBlur = activeRadius * 2;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
            });
            ctx.shadowBlur = 0; 

            // 2. Render Lines using Optimized Midpoint Curves for Maximum Smoothness & Speed
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const allStrokesToDraw = [...completedStrokes];
            if (drawingStroke.length > 0) {
                allStrokesToDraw.push(drawingStroke);
            }

            allStrokesToDraw.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.strokeStyle = `rgba(244, 234, 224, ${0.85 * opacity})`;
                drawFastSmoothPath(stroke);
            });
        }

        // High-Speed Midpoint Quadratic Curve Rendering Loop
        function drawFastSmoothPath(points) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            if (points.length === 2) {
                ctx.lineTo(points[1].x, points[1].y);
            } else {
                let i = 1;
                for (; i < points.length - 2; i++) {
                    const xc = (points[i].x + points[i + 1].x) * 0.5;
                    const yc = (points[i].y + points[i + 1].y) * 0.5;
                    ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
                }
                ctx.quadraticCurveTo(points[i].x, points[i].y, points[i + 1].x, points[i + 1].y);
            }
            ctx.stroke();
        }

        // Pure Coordinate Capture Engine (SNAPPING REMOVED)
        function getCanvasCoordinates(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Ambient Guidance Trigger: Illuminate dot when path sweeps near it
            for (let dot of dots) {
                const dist = Math.hypot(x - dot.x, y - dot.y);
                if (dist < proximityRadius) {
                    dot.active = true;
                }
            }
            return { x, y }; 
        }

        // --- INTERACTION EVENT LISTENERS ---
        function startDrawing(e) {
            if (isDissolving) return;
            isDrawing = true;
            
            // Minimize lower interface controls instantly upon canvas touch
            footer.classList.add('minimize-controls');

            const point = e.touches ? e.touches[0] : e;
            const currentPoint = getCanvasCoordinates(point.clientX, point.clientY);
            drawingStroke = [currentPoint];
            drawScene();
        }

        function moveDrawing(e) {
            if (!isDrawing || isDissolving) return;
            const point = e.touches ? e.touches[0] : e;
            const currentPoint = getCanvasCoordinates(point.clientX, point.clientY);

            const lastPoint = drawingStroke[drawingStroke.length - 1];
            // Tightened delta captures pure, seamless, freeform movement variations instantly
            if (Math.hypot(currentPoint.x - lastPoint.x, currentPoint.y - lastPoint.y) > 0.5) {
                drawingStroke.push(currentPoint);
                drawScene();
            }
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            
            // Restore control layout to normal when canvas is released
            footer.classList.remove('minimize-controls');

            if (drawingStroke.length > 1) {
                completedStrokes.push(drawingStroke);
            }
            drawingStroke = [];
            drawScene();
        }

        // Bind Mouse System
        canvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', moveDrawing);
        window.addEventListener('mouseup', stopDrawing);

        // Mobile Touch System
        canvas.addEventListener('touchstart', startDrawing);
        window.addEventListener('touchmove', moveDrawing, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // --- CALMING FEATURE ROUTINES ---

        // Grid Size Configuration Button
        gridBtn.addEventListener('click', () => {
            currentGridIndex = (currentGridIndex + 1) % gridLayouts.length;
            gridBtn.innerText = `🎛️ Grid: ${gridLayouts[currentGridIndex].label}`;
            completedStrokes = [];
            drawingStroke = [];
            resizeCanvas();
        });

        // Dot Radius Configuration Button
        sizeBtn.addEventListener('click', () => {
            currentSizeIndex = (currentSizeIndex + 1) % dotSizeSequence.length;
            sizeBtn.innerText = `⚪ Dot Size: ${dotSizeSequence[currentSizeIndex]}`;
            drawScene();
        });

        // Dissolve Canvas Transition Engine
        clearBtn.addEventListener('click', () => {
            if (completedStrokes.length === 0 || isDissolving) return;
            isDissolving = true;
            let opacity = 1;

            function fadeAnimation() {
                opacity -= 0.04;
                if (opacity <= 0) {
                    completedStrokes = [];
                    drawingStroke = [];
                    initGrid();
                    isDissolving = false;
                    drawScene(1); 
                } else {
                    drawScene(opacity);
                    requestAnimationFrame(fadeAnimation);
                }
            }
            requestAnimationFrame(fadeAnimation);
        });

        // Zen Mode Mechanics Controller Toggle
        function toggleZenMode() {
            zenModeActive = !zenModeActive;
            if (zenModeActive) {
                document.body.classList.add('zen-active');
            } else {
                document.body.classList.remove('zen-active');
            }
            setTimeout(() => {
                resizeCanvas();
            }, 500);
        }

        zenBtn.addEventListener('click', toggleZenMode);
        
        // Double Tap / Double Click Anywhere to Escape Zen Mode Safely
        window.addEventListener('dblclick', () => {
            if (zenModeActive) toggleZenMode();
        });
        
        let lastTap = 0;
        window.addEventListener('touchstart', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                if (zenModeActive) {
                    toggleZenMode();
                    e.preventDefault();
                }
            }
            lastTap = currentTime;
        });

        completeBtn.addEventListener('click', () => {
            alert("Your Mindful Kolam has been beautifully preserved inside your routine logs. ✨");
        });

        // Initialize Application
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
